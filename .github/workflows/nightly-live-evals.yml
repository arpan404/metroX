name: Nightly Live Evals

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  nightly-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.8.0'
      - name: Setup Python
        run: uv python install 3.13
      - name: Install backend dependencies
        run: |
          cd apps/server
          uv sync --dev --frozen
      - name: Run nightly live suite
        env:
          AUTOREDTEAM_DATABASE_URL: sqlite:///./nightly.db
          AUTOREDTEAM_API_KEY: ${{ secrets.AUTOREDTEAM_API_KEY }}
          AUTOREDTEAM_LIVE_PROVIDER_KEY: ${{ secrets.AUTOREDTEAM_LIVE_PROVIDER_KEY }}
        run: |
          cd apps/server
          uv run pytest -q -m nightly
