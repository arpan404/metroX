[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoredteam-server"
version = "0.1.0"
description = "AutoRedTeam DS+ backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "afk-py @ file:///Users/arpanbhandari/code/afk-py",
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.1",
  "numpy>=2.2.0",
  "pandas>=2.2.3",
  "scikit-learn>=1.6.0",
  "statsmodels>=0.14.4",
  "scipy>=1.14.1",
  "umap-learn>=0.5.7",
  "hdbscan>=0.8.40",
  "networkx>=3.4.2",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
  "nightly: marks tests that are intended for nightly/live pipelines",
]
