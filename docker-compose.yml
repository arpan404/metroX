version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autoredteam
      POSTGRES_PASSWORD: autoredteam
      POSTGRES_DB: autoredteam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  server:
    build:
      context: ./apps/server
    environment:
      AUTOREDTEAM_DATABASE_URL: postgresql+psycopg://autoredteam:autoredteam@postgres:5432/autoredteam
      AUTOREDTEAM_API_KEY: local-dev-key
      AUTOREDTEAM_REDIS_URL: redis://redis:6379/0
      AUTOREDTEAM_ALLOW_SYNTHETIC_TARGETS: "true"
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  client:
    build:
      context: ./apps/client
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_API_KEY: local-dev-key
    depends_on:
      - server
    ports:
      - "5173:5173"

volumes:
  postgres_data:
